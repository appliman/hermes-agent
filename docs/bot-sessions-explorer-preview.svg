    <text x="664" y="224" fill="#c9d1d9" font-size="12">• Worker Queue: 0 failed jobs, 2 active workers</text>
    <text x="664" y="244" fill="#c9d1d9" font-size="12">• Database Migrations: up to date (rev 2026_11_26)</text>
    <text x="664" y="264" fill="#4ade80" font-size="12">• Status: Ready for release v2.4</text>

    <text x="634" y="306" fill="#c9d1d9" font-size="12.5">Generating release notes from the last 12 merged pull requests…</text>
    <rect x="634" y="322" width="140" height="22" rx="11" fill="#163022" />
    <circle cx="648" cy="333" r="3" fill="#22c55e" />
    <text x="658" y="337" fill="#4ade80" font-size="11" font-weight="600">Running tool: git_log</text>

