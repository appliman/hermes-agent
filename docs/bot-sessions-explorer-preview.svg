    <rect x="526" y="221" width="52" height="18" rx="9" fill="#1f242c" />
    <text x="552" y="234" fill="#c9d1d9" font-size="10.5" text-anchor="middle">Regular</text>
    <text x="322" y="255" fill="#8b949e" font-size="11.5">All packages up to date, 0 advisories found.</text>
