    <text x="16" y="630" fill="#8b949e" font-size="11">cloud-prod  ·  Backend ready</text>
    <text x="1184" y="630" fill="#8b949e" font-size="11" text-anchor="end">Bots   ·   Smart   ·   client v0.23.2</text>
